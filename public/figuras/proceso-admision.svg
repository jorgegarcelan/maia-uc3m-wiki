<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" width="900" height="400">
  <title id="t">Proceso de admisión al máster MAIA, paso a paso</title>
  <desc id="d">Solicitud online, envío de documentación, valoración del perfil STEM con posibles complementos formativos, evaluación de la comisión sobre 10 puntos, resolución, reserva de plaza de 800 euros, matrícula e inicio del máster.</desc>
  <defs>
    <linearGradient id="maia" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2477f4"/><stop offset="1" stop-color="#6538f3"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#8ea3c8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#071f4a" flood-opacity=".06"/>
    </filter>
    <style>
      text{font-family:"Varela Round",system-ui,-apple-system,"Segoe UI",sans-serif}
      .eyebrow{font-size:11px;font-weight:700;letter-spacing:.11em;fill:#65708a}
      .step{font-size:12px;font-weight:800;fill:#111d36;letter-spacing:-.01em}
      .meta{font-size:10px;fill:#65708a}
      .num{font-size:10px;font-weight:700;letter-spacing:.1em;fill:#8590a8}
      .yes{font-size:11px;font-weight:700;fill:#2b7a4b}
      .no{font-size:11px;font-weight:700;fill:#c74343}
      .white{fill:#ffffff}
      .note{font-size:11px;fill:#8590a8}
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="398" rx="18" fill="#ffffff" stroke="#dce3f1"/>
  <text class="eyebrow" x="32" y="38">DE LA SOLICITUD AL PRIMER DÍA DE CLASE</text>

  <g filter="url(#soft)">
    <rect x="20"  y="64" width="185" height="72" rx="15" fill="#ffffff" stroke="#dce3f1"/>
    <rect x="242" y="64" width="185" height="72" rx="15" fill="#ffffff" stroke="#dce3f1"/>
    <rect x="464" y="64" width="185" height="72" rx="15" fill="#f5f7fd" stroke="#c7d3ea"/>
    <rect x="686" y="64" width="185" height="72" rx="15" fill="#ffffff" stroke="#dce3f1"/>
    <rect x="440" y="170" width="232" height="52" rx="14" fill="#eeebff" stroke="#d3caff"/>
    <rect x="20"  y="280" width="185" height="72" rx="15" fill="#f5f7fd" stroke="#c7d3ea"/>
    <rect x="242" y="280" width="185" height="72" rx="15" fill="#ffffff" stroke="#dce3f1"/>
    <rect x="464" y="280" width="185" height="72" rx="15" fill="#ffffff" stroke="#dce3f1"/>
    <rect x="686" y="280" width="185" height="72" rx="15" fill="url(#maia)"/>
  </g>

  <text class="num"  x="40" y="88">PASO 1</text>
  <text class="step" x="40" y="108">Solicitud online</text>
  <text class="meta" x="40" y="126">aplicaciones.uc3m.es</text>

  <text class="num"  x="262" y="88">PASO 2</text>
  <text class="step" x="262" y="108">Documentación</text>
  <text class="meta" x="262" y="126">Título, expediente, carta</text>

  <text class="num"  x="484" y="88">COMPROBACIÓN</text>
  <text class="step" x="484" y="108">¿Perfil STEM con</text>
  <text class="step" x="484" y="126">base suficiente?</text>

  <text class="num"  x="706" y="88">PASO 3</text>
  <text class="step" x="706" y="108">Evaluación académica</text>
  <text class="meta" x="706" y="126">Baremo sobre 10 puntos</text>

  <text class="step" x="462" y="194">Complementos formativos</text>
  <text class="meta" x="462" y="212">Hasta 6 ECTS adicionales</text>

  <text class="num"  x="40" y="304">PASO 4</text>
  <text class="step" x="40" y="324">Resolución de admisión</text>
  <text class="meta" x="40" y="342">40 plazas ofertadas</text>

  <text class="num"  x="262" y="304">PASO 5</text>
  <text class="step" x="262" y="324">Reserva de plaza</text>
  <text class="meta" x="262" y="342">A cuenta de la matrícula</text>

  <text class="num"  x="484" y="304">PASO 6</text>
  <text class="step" x="484" y="324">Matrícula oficial</text>
  <text class="meta" x="484" y="342">Tiempo completo o parcial</text>

  <text class="num white"  x="706" y="304">PASO 7</text>
  <text class="step white" x="706" y="324">Inicio del máster</text>
  <text class="meta white" x="706" y="342">7 de septiembre de 2026</text>

  <g stroke="#8ea3c8" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M205 100 H236"/>
    <path d="M427 100 H458"/>
    <path d="M649 100 H680"/>
    <path d="M556.5 136 V164"/>
    <path d="M672 196 H778.5 V142"/>
    <path d="M871 100 H884 V250 H112.5 V274"/>
    <path d="M205 316 H236"/>
    <path d="M427 316 H458"/>
    <path d="M649 316 H680"/>
  </g>

  <text class="yes" x="656" y="92">Sí</text>
  <text class="no"  x="564" y="158">No</text>
  <text class="note" x="32" y="374">Si la resolución es negativa, el proceso termina en el paso 4. Las cartas de recomendación deben llegar como máximo 3 días después de enviar la solicitud.</text>
</svg>
